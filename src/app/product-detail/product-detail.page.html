<ion-header [translucent]="true">
  <ion-toolbar class="detail-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/catalog" class="detail-back-btn"></ion-back-button>
    </ion-buttons>
    <ion-title><span class="toolbar-brand">Detalle del producto</span></ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="detail-content">
  <div class="loading-state" *ngIf="loading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <ng-container *ngIf="!loading">
    <div class="product-detail" *ngIf="product as p; else notFound">
      <div class="detail-grid">
        <div class="image-wrapper">
          <img
            [src]="mainImage"
            [alt]="p.name"
            [class.placeholder-logo]="!p.imageUrl"
          />
        </div>

        <div class="info">
          <p class="brand" *ngIf="p.productType">{{ p.productType }}</p>
          <h1 class="name">{{ p.name }}</h1>
          <p class="price">Bs. {{ p.price | number: '1.2-2' }}</p>

          <span
            class="stock-pill"
            [class.success]="stockBadgeColor === 'success'"
            [class.warning]="stockBadgeColor === 'warning'"
            [class.danger]="stockBadgeColor === 'danger'"
          >
            {{ stockBadgeLabel }}
          </span>

          <p class="qty-label">Selecciona una cantidad</p>
          <div class="qty-controls">
            <button
              type="button"
              class="qty-step-btn"
              [disabled]="quantity <= 0"
              (click)="decreaseQuantity()"
            >&minus;</button>
            <input
              type="number"
              class="qty-input"
              [value]="quantity"
              min="0"
              [max]="p.stock"
              (change)="onQuantityChange($any($event.target).value)"
            />
            <button
              type="button"
              class="qty-step-btn"
              [disabled]="quantity >= p.stock"
              (click)="increaseQuantity()"
            >+</button>
          </div>

          <ion-button
            expand="block"
            class="add-to-cart-btn"
            [disabled]="quantity === 0 || stockStatus === 'out_of_stock'"
            (click)="addToCart()"
          >
            <ion-icon slot="start" name="cart-outline"></ion-icon>
            Agregar al carrito
          </ion-button>

          <div class="description-section">
            <h2>Descripción</h2>
            <p class="description" *ngIf="p.description; else noDescription">{{ p.description }}</p>
            <ng-template #noDescription>
              <p class="description no-description">Sin descripción</p>
            </ng-template>
          </div>
        </div>
      </div>
    </div>

    <ng-template #notFound>
      <div class="empty-state">
        <ion-icon name="alert-circle-outline" class="empty-icon"></ion-icon>
        <p>Producto no encontrado</p>
        <ion-button fill="outline" (click)="goToCatalog()">
          Volver al catálogo
        </ion-button>
      </div>
    </ng-template>
  </ng-container>
</ion-content>
