<ion-content class="age-gate-content">
  <div class="age-gate-body">
    <div class="brand-badge">
      <img src="assets/icon/logo-head-master.png" alt="Drakarys" class="logo" />
    </div>

    <h1>{{ 'ageGate.title' | translate }}</h1>
    <p>
      {{ 'ageGate.description' | translate }}
    </p>

    <ion-button
      expand="block"
      color="success"
      size="large"
      class="age-btn"
      (click)="confirm()"
    >
      <ion-icon slot="start" name="checkmark-circle-outline"></ion-icon>
      {{ 'ageGate.confirmButton' | translate }}
    </ion-button>

    <ion-button
      expand="block"
      color="danger"
      size="large"
      fill="outline"
      class="age-btn"
      (click)="decline()"
    >
      <ion-icon slot="start" name="close-circle-outline"></ion-icon>
      {{ 'ageGate.declineButton' | translate }}
    </ion-button>
  </div>
</ion-content>
